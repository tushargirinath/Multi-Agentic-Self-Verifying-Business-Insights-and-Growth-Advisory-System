version: "2.0"
metrics:
  gross_revenue:
    name: "Gross Revenue"
    description: "Total sales value excluding cancellations and non-merchandise"
    sql: "SUM(line_total) FILTER (WHERE row_class = 'sale')"
    currency: "GBP"
    grain: ["shop", "day", "month", "country", "product"]
    assumptions: ["currency=GBP", "cancellations excluded"]

  net_revenue:
    name: "Net Revenue"
    description: "Gross revenue minus returns and cancellations"
    sql: "SUM(line_total) FILTER (WHERE row_class IN ('sale', 'cancellation'))"
    currency: "GBP"
    grain: ["shop", "day", "month", "country", "product"]
    assumptions: ["currency=GBP", "cancellations netted"]

  orders:
    name: "Orders Count"
    description: "Distinct order count for sales transactions"
    sql: "COUNT(DISTINCT order_id) FILTER (WHERE row_class = 'sale')"
    grain: ["shop", "day", "month", "country", "customer"]
    assumptions: ["cancelled orders excluded"]

  units:
    name: "Units Sold"
    description: "Total quantity of physical items sold"
    sql: "SUM(quantity) FILTER (WHERE row_class = 'sale')"
    grain: ["shop", "day", "month", "product"]
    assumptions: ["returns excluded"]

  aov:
    name: "Average Order Value (AOV)"
    description: "Gross revenue divided by distinct sales orders"
    sql: "SUM(line_total) FILTER (WHERE row_class = 'sale') * 1.0 / NULLIF(COUNT(DISTINCT order_id) FILTER (WHERE row_class = 'sale'), 0)"
    currency: "GBP"
    assumptions: ["currency=GBP", "cancellations excluded"]

  units_per_order:
    name: "Units Per Order"
    description: "Total sales units divided by distinct sales orders"
    sql: "SUM(quantity) FILTER (WHERE row_class = 'sale') * 1.0 / NULLIF(COUNT(DISTINCT order_id) FILTER (WHERE row_class = 'sale'), 0)"
    assumptions: ["cancellations excluded"]

  customers:
    name: "Unique Customers"
    description: "Distinct registered customer count with at least one sale order"
    sql: "COUNT(DISTINCT customer_token) FILTER (WHERE row_class = 'sale' AND customer_token IS NOT NULL)"
    assumptions: ["guest orders excluded"]

  repeat_rate:
    name: "Customer Repeat Rate"
    description: "Proportion of registered customers with 2 or more orders"
    sql: |
      WITH cust_orders AS (
        SELECT customer_token, COUNT(DISTINCT order_id) as o
        FROM fact_order_lines
        WHERE row_class = 'sale' AND customer_token IS NOT NULL
        GROUP BY 1
      )
      SELECT AVG((o >= 2)::INT) as repeat_rate FROM cust_orders
    assumptions: ["measured over full available customer history"]

  cancellation_rate_value:
    name: "Cancellation Rate by Value"
    description: "Absolute cancellation value divided by gross sales revenue"
    sql: "ABS(SUM(line_total) FILTER (WHERE row_class = 'cancellation')) * 1.0 / NULLIF(SUM(line_total) FILTER (WHERE row_class = 'sale'), 0)"
    assumptions: ["returns and order cancellations included"]

  revenue_per_customer:
    name: "Revenue Per Customer"
    description: "Gross revenue divided by registered customers"
    sql: "SUM(line_total) FILTER (WHERE row_class = 'sale') * 1.0 / NULLIF(COUNT(DISTINCT customer_token) FILTER (WHERE row_class = 'sale' AND customer_token IS NOT NULL), 0)"
    currency: "GBP"
    assumptions: ["guest orders excluded"]

  concentration_top10:
    name: "Top 10 Product Revenue Concentration"
    description: "Percentage of gross sales revenue generated by the top 10 SKUs"
    sql: |
      WITH prod_rev AS (
        SELECT sku, SUM(line_total) as rev
        FROM fact_order_lines WHERE row_class = 'sale'
        GROUP BY 1 ORDER BY rev DESC
      ),
      totals AS (
        SELECT SUM(rev) as total_rev FROM prod_rev
      ),
      top10 AS (
        SELECT SUM(rev) as top10_rev FROM (SELECT rev FROM prod_rev LIMIT 10)
      )
      SELECT top10_rev * 100.0 / NULLIF(total_rev, 0) as concentration_top10
      FROM top10, totals
    assumptions: ["cancellations excluded"]
